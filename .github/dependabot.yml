version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # enable security updates (Dependabot will create PRs for vulnerable versions)
    security-updates: true

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

# Example grouping (grouped security updates / grouped version updates can be tuned here)
groups:
  all-security:
    patterns:
      - "*"
    update-types:
      - "version-update:semver-major"
      - "security"